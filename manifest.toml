packaging_format = 2

id = "rss"
name = "RSS"
description.en = "Simple RSS feed aggregator"
description.fr = "Agrégateur de flux RSS simple"

version = "1.5.3~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
code = "https://codeberg.org/danb/rss/"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap =false
sso = false
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://codeberg.org/danb/rss/archive/v1.5.3.tar.gz"
        sha256 = "74dc8d9d0d090ef1a3ce075825dcb6b70ed9a19f9d4af6249e23d4d131785cc8"
        autoupdate.strategy = "latest_gitea_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "sqlite3, php8.3-cli, php8.3-cgi,php8.3-curl, php8.3-mbstring, php8.3-xml, php8.3-zip, php8.3-gd, php8.3-sqlite3, php8.3-bcmath"
