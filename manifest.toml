packaging_format = 2

id = "rss"
name = "RSS"
description.en = "Simple RSS feed aggregator"
description.fr = "Agrégateur de flux RSS simple"

version = "2.2.3~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
code = "https://codeberg.org/danb/rss/"

[integration]
yunohost = ">= 11.2.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap =false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        url = "https://codeberg.org/danb/rss/archive/v2.2.3.tar.gz"
        sha256 = "05e1d7739691b000b2e09be2656e0c19b27429d4175dc7fd4f73aed00a671d79"
        autoupdate.strategy = "latest_gitea_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "sqlite3, php8.5-cli, php8.5-cgi, php8.5-curl, php8.5-mbstring, php8.5-xml, php8.5-zip, php8.5-gd, php8.5-sqlite3, php8.5-bcmath"
    
    [resources.composer]
    version = "2.10.3"

    [resources.nodejs]
    version = "24"
